[project]
name = "lure-train"
version = "0.1.0"
description = "Training code for Lure TTS: SFT, specialist GRPO branches, on-policy distillation, fast code-predictor heads"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = ["modal>=1.0", "numpy>=2.0"]

[project.optional-dependencies]
# Everything heavy (torch, qwen-tts, transformers, qwen-asr, funasr) is installed inside the Modal images defined in
# lure_train/common.py, not locally.
dev = ["ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lure_train*"]

[tool.ruff]
line-length = 160
